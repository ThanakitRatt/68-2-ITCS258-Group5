services:
  nginx:
      image: nginx:alpine
      ports:
        - "80:80"
      volumes:
        - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      depends_on:
        - api
      networks:
        - appnet
  # ── MySQL ────────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: hotel_db
    restart: always
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-Group5_ICTHotel}
      MYSQL_USER: ${MYSQL_USER:-ICTHotelUser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-1234}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./Group5_ICTHotelDB.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-rootpassword}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:alpine
    container_name: hotel_redis
    ports:
      - "6379:6379"
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - appnet

  # ── NestJS API ───────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hotel_api
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: mysql://${MYSQL_USER:-ICTHotelUser}:${MYSQL_PASSWORD:-1234}@db:3306/${MYSQL_DATABASE:-Group5_ICTHotel}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-changeme_in_production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      PORT: 3000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - appnet

volumes:
  mysql_data:

networks:
  appnet: